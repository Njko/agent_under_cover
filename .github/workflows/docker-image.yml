# Construit, teste et publie l'image Docker de l'application dans GitHub Container Registry (ghcr.io).
# Voir doc/docker.md.
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Les noms d'image Docker doivent être en minuscules (le compte GitHub est « Njko »).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Test avant publication : l'image démarre avec les mêmes restrictions qu'en production
      # (lecture seule, aucune capacité, /tmp en mémoire) et répond sur /healthz et /.
      - name: Construction pour le test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: undercover:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de l'image
        run: |
          docker run -d --name undercover -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges undercover:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Undercover IA responsable"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          docker logs undercover

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction multi-architecture et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
