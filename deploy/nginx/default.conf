# Configuration nginx de l'application Undercover IA responsable (image Docker).
# Remplace /etc/nginx/conf.d/default.conf de l'image nginx-unprivileged (inclus dans le bloc http).
# L'application est 100 % statique : nginx ne fait que servir des fichiers, sans proxy ni backend.

# Cache HTTP : les noms de fichiers ne sont pas versionnés, donc HTML, CSS, JS et service worker
# sont revalidés à chaque visite (ETag, réponse 304 sans contenu si rien n'a changé).
map $uri $undercover_cache_control {
    default                 "no-cache";
    ~^/(img|icons|vendor)/  "public, max-age=604800";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset       utf-8;
    charset_types text/css application/javascript application/manifest+json image/svg+xml;

    # Compression (le HTML est toujours compressé quand gzip est actif).
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types      text/css application/javascript application/json application/manifest+json image/svg+xml;

    # En-têtes de sécurité, sur toutes les réponses (y compris les erreurs).
    # La CSP reprend celle de index.html et y ajoute frame-ancestors (impossible en balise meta).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $undercover_cache_control always;

    # Sonde de santé pour Docker et Kubernetes (non journalisée).
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le manifeste d'application web n'est pas dans mime.types de l'image.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    # Aucun fichier caché (.git, .nojekyll…) n'est servi.
    location ~ /\. {
        deny all;
    }

    # La navigation de l'application passe par le fragment d'URL (#/…), jamais transmis au serveur :
    # seuls des fichiers existants sont demandés, pas besoin de renvoyer index.html par défaut.
    location / {
        try_files $uri $uri/ =404;
    }
}
